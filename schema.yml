        user:
          type: integer
          readOnly: true
          title: Foydalanuvchi
        user_name:
          type: string
          readOnly: true
        product:
          type: integer
          title: Mahsulot
        comment:
          type: string
          title: Sharh matni
        rating:
          type: integer
