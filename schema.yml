components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        region:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 200
        street:
          type: string
          maxLength: 200
        house_number:
          type: string
          maxLength: 200
      required:
      - city
      - house_number
      - id
      - region
      - street
    BlankEnum:
      enum:
      - ''
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
          title: Foydalanuvchi
        session_key:
          type: string
          nullable: true
          title: Sessiya kaliti
          maxLength: 40
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total_quantity:
          type: integer
          readOnly: true
      required:
      - id
      - items
      - total_price
      - total_quantity
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        variant:
          type: integer
          title: Mahsulot varianti
        variant_detail:
          allOf:
          - $ref: '#/components/schemas/ProductVariant'
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Miqdori
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - subtotal
      - variant
      - variant_detail
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Kategoriya nomi
          maxLength: 255
        slug:
          oneOf:
          - type: string
            maxLength: 255
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        parent:
          type: integer
          nullable: true
          title: Asosiy kategoriya
      required:
      - id
      - title
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - old_password
    Comment:
      type: object
      properties:
        id:
          type: integer
